name: Build standalone installers

# Builds self-contained executables (Python embedded — users need NOTHING
# installed) for Windows, macOS and Linux, and attaches them to a GitHub
# Release when a v* tag is pushed.

on:
  push:
    tags: ["v*"]
    branches: ["main", "claude/audio-stem-splitter-f95sov"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            exe: StemSplitter.exe
          - os: macos-latest
            label: macOS
            exe: StemSplitter
          - os: ubuntu-latest
            label: Linux
            exe: StemSplitter
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        shell: python
        run: |
          import os, subprocess, sys
          sep = os.pathsep  # ';' on Windows, ':' elsewhere
          subprocess.check_call([
              sys.executable, "-m", "PyInstaller", "--noconfirm", "--clean",
              "--onefile", "--name", "StemSplitter",
              "--add-data", f"frontend{sep}frontend",
              "--collect-all", "imageio_ffmpeg",
              "--collect-all", "soundfile",
              "--hidden-import", "backend.main",
              "launcher.py",
          ])

      - name: Smoke-test executable
        shell: python
        run: |
          import subprocess, time, urllib.request, os, signal, sys
          exe = os.path.join("dist", "${{ matrix.exe }}")
          proc = subprocess.Popen([exe])
          ok = False
          for _ in range(60):
              time.sleep(1)
              for port in range(8000, 8020):
                  try:
                      with urllib.request.urlopen(f"http://127.0.0.1:{port}/api/health", timeout=1) as r:
                          ok = r.status == 200
                          break
                  except Exception:
                      continue
              if ok:
                  break
          proc.terminate()
          sys.exit(0 if ok else 1)

      - name: Package zip
        run: python -m zipfile -c StemSplitter-${{ matrix.label }}.zip dist/${{ matrix.exe }} LEIA-ME.txt

      - uses: actions/upload-artifact@v4
        with:
          name: StemSplitter-${{ matrix.label }}
          path: StemSplitter-${{ matrix.label }}.zip

  release:
    # A release is published when any of these provide a version:
    #   1. a v* tag was pushed;
    #   2. a manual dispatch passed the `tag` input;
    #   3. a branch push whose commit message contains "release vX.Y.Z"
    #      (fallback for environments whose credentials can push commits to
    #      the branch but not tags — the release action then creates the tag
    #      at this commit using the workflow's own token).
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'release v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Determine tag
        id: tag
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG=$(printf '%s' "$MSG" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          fi
          [[ -n "$TAG" ]] || { echo "no version found"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: StemSplitter-*.zip
          body: |
            ## StemSplitter — instalação sem depender de nada

            **Não precisa de Python nem de nenhum outro programa instalado.**

            1. Baixe o arquivo do seu sistema abaixo
            2. Extraia o ZIP
            3. Dê **dois cliques** no `StemSplitter` (ou `StemSplitter.exe`)
            4. O navegador abre sozinho na mesa de mixagem 🎛️

            | Sistema | Arquivo |
            |---|---|
            | Windows | `StemSplitter-Windows.zip` |
            | macOS | `StemSplitter-macOS.zip` |
            | Linux | `StemSplitter-Linux.zip` |

            > **Windows**: se o SmartScreen avisar "aplicativo não reconhecido", clique em *Mais informações → Executar assim mesmo* (o executável não é assinado digitalmente).
            > **macOS**: na primeira vez, clique com o botão direito no app → *Abrir* (mesmo motivo).

            Esta versão usa o motor DSP de prévia. Para qualidade de estúdio (Demucs, rede neural), use a instalação via Python descrita no [README](https://github.com/ganwalk/stemsplitter#readme).
